name: Generate PDF Planner

on:
  push:
    branches: [ main ]
    paths:
      - 'turtleplanner.py'
      - 'requirements.txt'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Generate PDF
      run: |
        python turtleplanner.py
        
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: turtle-diaries-planner
        path: turtle_diaries_planner.pdf
        
    - name: Commit and push PDF to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add turtle_diaries_planner.pdf
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-generate turtle planner PDF 🐢

          Generated by GitHub Actions on $(date)
          
          🤖 Generated with [Claude Code](https://claude.ai/code)
          
          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push
        fi