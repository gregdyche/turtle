<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turtle Talk — Greg Dyche</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Reveal.js Core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/simple.css" id="theme">

  <!-- Optional: Code syntax highlight (not needed but nice) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css">

  <style>
    /* Quick quality-of-life touches */
    .reveal section { font-size: 32px; }
    h1, h2 { color: #0b3d91; } /* Creighton Blue vibe */
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <!-- Load slides.md -->
      <section data-markdown="slides.md"
               data-separator="^---$"
               data-separator-vertical="^--$"
               data-charset="utf-8">
      </section>
    </div>
  </div>

  <!-- Reveal.js Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: true,
      progress: true,
      transition: 'fade',

      plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });
  </script>
</body>
</html>
